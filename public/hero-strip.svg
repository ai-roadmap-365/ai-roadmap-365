<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="hsTitle hsDesc" preserveAspectRatio="xMidYMid meet">
  <title id="hsTitle">Nine courses, one continuous path from Day 1 to Day 365</title>
  <desc id="hsDesc">A slim map of the year: nine labelled stops - Foundations, Python, Maths, Machine Learning, Deep Learning, LLMs, AI Engineering, Deploy and Capstone - joined by one line, with a marker travelling from the first to the last and the words Day 1 at the left and Day 365 at the right.</desc>

  <defs>
    <linearGradient id="hsPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#a78bfa" />
      <stop offset="85%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="hsGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    .hsCap  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; fill: #64748b; letter-spacing: 1px; }
    .hsName { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 650; fill: #94a3b8; }

    .hsLine { fill: none; stroke: url(#hsPath); stroke-width: 4; stroke-linecap: round; }
    .hsFlow {
      fill: none; stroke: #f8fafc; stroke-width: 2; stroke-linecap: round;
      stroke-dasharray: 4 20; opacity: 0.5;
      animation: hsMarch 2s linear infinite;
    }
    @keyframes hsMarch { to { stroke-dashoffset: -24; } }

    .hsDot { fill: #0b1220; stroke-width: 3; }
    .hsD1 { stroke: #38bdf8 } .hsD2 { stroke: #818cf8 } .hsD3 { stroke: #f472b6 }
    .hsD4 { stroke: #4ade80 } .hsD5 { stroke: #fbbf24 } .hsD6 { stroke: #a78bfa }
    .hsD7 { stroke: #22d3ee } .hsD8 { stroke: #fb7185 } .hsD9 { stroke: #facc15 }

    /* One learner crossing the year. It rests at Day 1, so a still frame
       reads as a journey about to start rather than a half-finished one. */
    .hsTok { animation: hsTravel 14s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes hsTravel {
      0%, 5%    { transform: translateX(0); }
      95%, 100% { transform: translateX(1010px); }
    }
    .hsHalo { animation: hsBreathe 2.6s ease-in-out infinite; }
    @keyframes hsBreathe { 0%, 100% { opacity: 0.5 } 50% { opacity: 0.95 } }

    @media (prefers-reduced-motion: reduce) {
      .hsFlow { animation: none; stroke-dasharray: none; opacity: 0.22; }
      .hsTok  { animation: none; transform: translateX(0); }
      .hsHalo { animation: none; opacity: 0.9; }
    }
  </style>

  <text class="hsCap" x="95" y="30" text-anchor="middle">DAY 1</text>
  <text class="hsCap" x="1105" y="30" text-anchor="middle">DAY 365</text>

  <path class="hsLine" d="M 95 58 H 1105" />
  <path class="hsFlow" d="M 95 58 H 1105" />

  <circle class="hsDot hsD1" cx="95"   cy="58" r="7" />
  <circle class="hsDot hsD2" cx="221"  cy="58" r="7" />
  <circle class="hsDot hsD3" cx="347"  cy="58" r="7" />
  <circle class="hsDot hsD4" cx="473"  cy="58" r="7" />
  <circle class="hsDot hsD5" cx="599"  cy="58" r="7" />
  <circle class="hsDot hsD6" cx="725"  cy="58" r="7" />
  <circle class="hsDot hsD7" cx="851"  cy="58" r="7" />
  <circle class="hsDot hsD8" cx="977"  cy="58" r="7" />
  <circle class="hsDot hsD9" cx="1105" cy="58" r="8" />

  <text class="hsName" x="95"   y="92" text-anchor="middle">Foundations</text>
  <text class="hsName" x="221"  y="92" text-anchor="middle">Python</text>
  <text class="hsName" x="347"  y="92" text-anchor="middle">Maths</text>
  <text class="hsName" x="473"  y="92" text-anchor="middle">Machine Learning</text>
  <text class="hsName" x="599"  y="92" text-anchor="middle">Deep Learning</text>
  <text class="hsName" x="725"  y="92" text-anchor="middle">LLMs</text>
  <text class="hsName" x="851"  y="92" text-anchor="middle">AI Engineering</text>
  <text class="hsName" x="977"  y="92" text-anchor="middle">Deploy</text>
  <text class="hsName" x="1105" y="92" text-anchor="middle">Capstone</text>

  <g class="hsTok">
    <circle class="hsHalo" cx="95" cy="58" r="13" fill="#38bdf8" opacity="0.5" filter="url(#hsGlow)" />
    <circle cx="95" cy="58" r="6" fill="#f8fafc" />
  </g>
</svg>
